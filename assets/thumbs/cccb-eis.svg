<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 266" width="400" height="266" role="img"
     aria-label="CCCB EIS cumulative projects: Lake Tahoe with project parcels and five scenic viewpoints shown as view cones">
  <!-- Background -->
  <rect width="400" height="266" fill="#EEF1F5"/>

  <!-- Basin boundary -->
  <path d="M120 18 C180 2 272 6 316 36 C352 80 348 170 322 226 C280 258 160 260 112 226 C74 170 78 76 120 18 Z"
        fill="#F7F8F4" stroke="#B5A64C" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Lake -->
  <path d="M158 44 C200 30 262 38 282 70 C300 110 292 172 268 206 C246 236 196 240 172 214 C146 186 140 130 146 90 C148 70 148 50 158 44 Z"
        fill="#B4CBE8" stroke="#0072CE" stroke-width="1.5"/>

  <!-- Viewpoint view cones -->
  <g fill="#E87722" fill-opacity="0.18" stroke="#E87722" stroke-width="1" stroke-opacity="0.6">
    <path d="M206 222 L176 162 L240 164 Z"/>
    <path d="M160 72 L212 54 L206 108 Z"/>
    <path d="M286 104 L240 86 L246 140 Z"/>
    <path d="M150 150 L196 126 L198 178 Z"/>
    <path d="M268 206 L230 170 L288 158 Z"/>
  </g>

  <!-- Cumulative project parcels -->
  <g fill="#0072CE" fill-opacity="0.75" stroke="#003B71" stroke-width="1.2">
    <rect x="186" y="222" width="12" height="9"/>
    <rect x="200" y="228" width="16" height="10"/>
    <rect x="218" y="220" width="10" height="8"/>
    <rect x="166" y="208" width="10" height="8"/>
    <rect x="236" y="214" width="12" height="9"/>
    <rect x="150" y="60" width="11" height="8"/>
    <rect x="164" y="48" width="9" height="7"/>
    <rect x="140" y="78" width="9" height="8"/>
    <rect x="288" y="92" width="10" height="8"/>
    <rect x="292" y="118" width="12" height="9"/>
    <rect x="134" y="152" width="10" height="8"/>
    <rect x="278" y="188" width="10" height="8"/>
    <rect x="280" y="206" width="12" height="9"/>
  </g>

  <!-- Viewpoint markers -->
  <g fill="#E87722" stroke="#FFFFFF" stroke-width="2">
    <circle cx="206" cy="222" r="6"/>
    <circle cx="160" cy="72" r="6"/>
    <circle cx="286" cy="104" r="6"/>
    <circle cx="150" cy="150" r="6"/>
    <circle cx="268" cy="206" r="6"/>
  </g>
  <g font-family="Open Sans, Arial, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="206" y="224.5">1</text><text x="160" y="74.5">2</text><text x="286" y="106.5">3</text><text x="150" y="152.5">4</text><text x="268" y="208.5">5</text>
  </g>

  <!-- Legend card -->
  <rect x="14" y="186" width="118" height="66" rx="6" fill="#FFFFFF" stroke="#DCE2EA"/>
  <text x="24" y="202" font-family="Open Sans, Arial, sans-serif" font-size="8" font-weight="700" fill="#003B71">CCCB EIS VISUAL ANALYSIS</text>
  <g font-family="Open Sans, Arial, sans-serif" font-size="8" fill="#404040">
    <rect x="24" y="211" width="10" height="8" fill="#0072CE" fill-opacity="0.75" stroke="#003B71" stroke-width="1"/>
    <text x="40" y="218">Cumulative project parcel</text>
    <circle cx="29" cy="235" r="4.5" fill="#E87722" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M29 235 L40 229 L40 241 Z" fill="#E87722" fill-opacity="0.25"/>
    <text x="46" y="238">Focal scenic viewpoint</text>
  </g>
</svg>
