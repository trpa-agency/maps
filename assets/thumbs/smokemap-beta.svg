<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 266" width="400" height="266" role="img"
     aria-label="Smoke forecast and air quality prototype: smoke plume over the Tahoe Basin with air quality readings">
  <defs>
    <!-- Smoke bands, using the same NWS concentration colors the map draws. -->
    <radialGradient id="plumeA" cx="30%" cy="40%" r="62%">
      <stop offset="0%"   stop-color="#AB5213" stop-opacity="0.85"/>
      <stop offset="45%"  stop-color="#F2A62C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FAD157" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plumeB" cx="42%" cy="46%" r="85%">
      <stop offset="0%"   stop-color="#FAD157" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFA3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Basemap -->
  <rect width="400" height="266" fill="#EEF1F5"/>
  <g stroke="#DCE2EA" stroke-width="1" fill="none">
    <path d="M0 62 H400 M0 130 H400 M0 198 H400 M96 0 V266 M200 0 V266 M304 0 V266"/>
  </g>

  <!-- Smoke drifting in from the northwest -->
  <ellipse cx="150" cy="112" rx="205" ry="118" fill="url(#plumeB)"/>
  <ellipse cx="112" cy="96"  rx="128" ry="76"  fill="url(#plumeA)"/>

  <!-- Lake Tahoe and the basin boundary -->
  <path d="M243 74 L262 82 L272 104 L275 133 L268 166 L252 192 L232 205 L214 196
           L204 172 L200 146 L206 116 L219 90 Z"
        fill="none" stroke="#003B71" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M232 96 L249 104 L256 128 L251 158 L239 180 L226 172 L219 148 L221 118 Z"
        fill="#B4CBE8" opacity="0.9"/>

  <!-- Fire incident: white flame in a filled circle, as on the map -->
  <g transform="translate(78,168)">
    <circle r="13" fill="#D6342C" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M12 22a7 7 0 0 0 7-7c0-5-4-7-5-11 0 0-1 4-3 6-1-1-1-3-1-3-2 2-5 5-5 8a7 7 0 0 0 7 7z"
          transform="translate(-7.4,-7.4) scale(0.62)" fill="#ffffff"/>
  </g>

  <!-- Satellite hot spots -->
  <g fill="#FF5000" stroke="#5A1400" stroke-width="0.5" opacity="0.9">
    <circle cx="58" cy="150" r="2.6"/><circle cx="66" cy="158" r="2.6"/>
    <circle cx="52" cy="161" r="2.6"/><circle cx="70" cy="145" r="2.6"/>
    <circle cx="88" cy="155" r="2.6"/>
  </g>

  <!-- Air quality readings, sized by device the way the map does -->
  <g stroke="#ffffff" stroke-width="1.4">
    <circle cx="228" cy="118" r="9"   fill="#FFFF00"/>
    <circle cx="262" cy="150" r="6.5" fill="#FF7E00"/>
    <circle cx="212" cy="182" r="6.5" fill="#00E400"/>
    <circle cx="300" cy="104" r="6.5" fill="#FFFF00"/>
    <circle cx="330" cy="168" r="5.5" fill="#00E400"/>
    <circle cx="168" cy="126" r="5.5" fill="#FF7E00"/>
  </g>

  <!-- Time bar, echoing the animation control -->
  <rect x="0" y="238" width="400" height="28" fill="#FFFFFF"/>
  <rect x="0" y="237" width="400" height="1" fill="#E2E6EC"/>
  <circle cx="22" cy="252" r="9" fill="#0072CE"/>
  <path d="M19 247.5 L27 252 L19 256.5 Z" fill="#FFFFFF"/>
  <rect x="42" y="249.5" width="340" height="5" rx="2.5" fill="#E2E6EC"/>
  <rect x="42" y="249.5" width="132" height="5" rx="2.5" fill="#0072CE"/>
  <circle cx="174" cy="252" r="6" fill="#FFFFFF" stroke="#0072CE" stroke-width="3"/>
</svg>
