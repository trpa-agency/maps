<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 266" width="400" height="266" role="img"
     aria-label="District explorer: a use type selector beside a basin map with every zoning district where that use is permitted highlighted">
  <!-- Background -->
  <rect width="400" height="266" fill="#EEF1F5"/>

  <!-- Selector panel -->
  <rect x="14" y="14" width="136" height="238" rx="8" fill="#FFFFFF" stroke="#DCE2EA"/>
  <rect x="14" y="14" width="136" height="30" rx="8" fill="#003B71"/>
  <rect x="14" y="34" width="136" height="10" fill="#003B71"/>
  <text x="26" y="34" font-family="Open Sans, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">FIND A USE</text>

  <g font-family="Open Sans, Arial, sans-serif">
    <text x="26" y="62" font-size="7.5" font-weight="700" fill="#6B7688">USE CATEGORY</text>
    <rect x="26" y="68" width="112" height="20" rx="4" fill="#FFFFFF" stroke="#DCE2EA"/>
    <text x="34" y="82" font-size="9" fill="#404040">Residential</text>
    <path d="M124 76 L128 80 L132 76" fill="none" stroke="#6B7688" stroke-width="1.5"/>

    <text x="26" y="106" font-size="7.5" font-weight="700" fill="#6B7688">USE TYPE</text>
    <rect x="26" y="112" width="112" height="20" rx="4" fill="#E5F2FC" stroke="#0072CE"/>
    <text x="34" y="126" font-size="9" font-weight="600" fill="#003B71">Multiple family</text>
    <path d="M124 120 L128 124 L132 120" fill="none" stroke="#0072CE" stroke-width="1.5"/>
  </g>

  <!-- Result list -->
  <g font-family="Open Sans, Arial, sans-serif" font-size="8" fill="#404040">
    <text x="26" y="154" font-size="7.5" font-weight="700" fill="#6B7688">42 DISTRICTS</text>
    <rect x="26" y="162" width="8" height="8" rx="2" fill="#4A6118"/><text x="40" y="169">Tourist Core</text><text x="118" y="169" font-size="7" fill="#6B7688">25/ac</text>
    <rect x="26" y="178" width="8" height="8" rx="2" fill="#4A6118"/><text x="40" y="185">Stateline Core</text><text x="118" y="185" font-size="7" fill="#6B7688">25/ac</text>
    <rect x="26" y="194" width="8" height="8" rx="2" fill="#4A6118"/><text x="40" y="201">Kings Beach Core</text><text x="118" y="201" font-size="7" fill="#6B7688">25/ac</text>
    <rect x="26" y="210" width="8" height="8" rx="2" fill="#E87722"/><text x="40" y="217">Bijou Al Tahoe</text><text x="118" y="217" font-size="7" fill="#6B7688">15/ac</text>
    <rect x="26" y="226" width="8" height="8" rx="2" fill="#E87722"/><text x="40" y="233">Tahoe City Center</text><text x="118" y="233" font-size="7" fill="#6B7688">15/ac</text>
  </g>

  <!-- Basin map -->
  <path d="M212 22 C256 6 328 10 362 40 C390 84 388 174 364 228 C330 258 240 258 204 230 C174 176 178 80 212 22 Z"
        fill="#F7F8F4" stroke="#DCE2EA" stroke-width="1.5"/>
  <!-- Lake -->
  <path d="M244 48 C280 36 328 44 344 74 C358 110 352 170 332 200 C312 230 266 234 246 208 C224 180 220 128 226 92 C228 72 232 54 244 48 Z"
        fill="#B4CBE8" stroke="#0072CE" stroke-width="1.5"/>
  <!-- Permitted districts (green) -->
  <g fill="#4A6118" fill-opacity="0.6" stroke="#4A6118" stroke-width="1">
    <path d="M262 210 L300 204 L318 226 L292 244 L258 236 Z"/>
    <path d="M232 62 L262 52 L270 78 L240 90 Z"/>
    <path d="M330 212 L352 196 L364 222 L344 236 Z"/>
    <path d="M346 90 L368 86 L372 112 L350 118 Z"/>
  </g>
  <!-- Conditionally approved (orange) -->
  <g fill="#E87722" fill-opacity="0.55" stroke="#E87722" stroke-width="1">
    <path d="M206 140 L228 134 L232 166 L210 172 Z"/>
    <path d="M304 222 L326 214 L336 238 L312 246 Z"/>
    <path d="M276 46 L302 40 L306 60 L280 66 Z"/>
    <path d="M350 150 L372 146 L370 176 L352 174 Z"/>
  </g>
  <!-- Not permitted (gray) -->
  <g fill="#DCE2EA" stroke="#C9CFD8" stroke-width="1">
    <path d="M206 92 L226 90 L222 126 L202 122 Z"/>
    <path d="M214 184 L234 178 L240 206 L220 214 Z"/>
    <path d="M356 190 L374 180 L378 206 L360 212 Z"/>
    <path d="M312 44 L336 50 L340 72 L318 70 Z"/>
  </g>

  <!-- Legend -->
  <g font-family="Open Sans, Arial, sans-serif" font-size="7.5" font-weight="700">
    <rect x="300" y="18" width="84" height="38" rx="5" fill="#FFFFFF" stroke="#DCE2EA"/>
    <rect x="308" y="25" width="8" height="8" rx="2" fill="#4A6118"/><text x="320" y="32" fill="#404040">Permitted</text>
    <rect x="308" y="41" width="8" height="8" rx="2" fill="#E87722"/><text x="320" y="48" fill="#404040">Special use</text>
  </g>
</svg>
