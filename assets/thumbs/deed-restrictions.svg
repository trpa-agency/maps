<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 266" width="400" height="266" role="img"
     aria-label="Deed restriction explorer: a parcel map with deed-restricted parcels highlighted by type, beside a filterable grid">
  <!-- Basemap -->
  <rect width="400" height="266" fill="#EEF1F5"/>

  <!-- Parcel grid -->
  <g stroke="#FFFFFF" stroke-width="2" fill="#DCE2EA">
    <rect x="14"  y="14"  width="52" height="44"/><rect x="70"  y="14"  width="52" height="44"/><rect x="126" y="14"  width="52" height="44"/><rect x="182" y="14"  width="52" height="44"/>
    <rect x="14"  y="62"  width="52" height="44"/><rect x="70"  y="62"  width="52" height="44"/><rect x="126" y="62"  width="52" height="44"/><rect x="182" y="62"  width="52" height="44"/>
    <rect x="14"  y="120" width="52" height="44"/><rect x="70"  y="120" width="52" height="44"/><rect x="126" y="120" width="52" height="44"/><rect x="182" y="120" width="52" height="44"/>
    <rect x="14"  y="168" width="52" height="44"/><rect x="70"  y="168" width="52" height="44"/><rect x="126" y="168" width="52" height="44"/><rect x="182" y="168" width="52" height="44"/>
    <rect x="14"  y="216" width="52" height="40"/><rect x="70"  y="216" width="52" height="40"/><rect x="126" y="216" width="52" height="40"/><rect x="182" y="216" width="52" height="40"/>
  </g>
  <!-- Streets -->
  <g stroke="#FFFFFF" stroke-width="6" fill="none">
    <path d="M6 110 H240 M6 166 H240 M124 6 V260"/>
  </g>
  <!-- Deed-restricted parcels by type -->
  <g stroke-width="2">
    <!-- Affordable / workforce housing -->
    <rect x="70"  y="62"  width="52" height="44" fill="#0072CE" fill-opacity="0.55" stroke="#0072CE"/>
    <rect x="182" y="120" width="52" height="44" fill="#0072CE" fill-opacity="0.55" stroke="#0072CE"/>
    <rect x="14"  y="216" width="52" height="40" fill="#0072CE" fill-opacity="0.55" stroke="#0072CE"/>
    <rect x="126" y="14"  width="52" height="44" fill="#0072CE" fill-opacity="0.55" stroke="#0072CE"/>
    <!-- Conservation / open space -->
    <rect x="14"  y="120" width="52" height="44" fill="#4A6118" fill-opacity="0.55" stroke="#4A6118"/>
    <rect x="14"  y="168" width="52" height="44" fill="#4A6118" fill-opacity="0.55" stroke="#4A6118"/>
    <rect x="182" y="216" width="52" height="40" fill="#4A6118" fill-opacity="0.55" stroke="#4A6118"/>
    <!-- Coverage / other -->
    <rect x="126" y="168" width="52" height="44" fill="#E87722" fill-opacity="0.55" stroke="#E87722"/>
    <rect x="182" y="14"  width="52" height="44" fill="#E87722" fill-opacity="0.55" stroke="#E87722"/>
  </g>
  <!-- Selected parcel -->
  <rect x="70" y="62" width="52" height="44" fill="none" stroke="#003B71" stroke-width="3.5"/>

  <!-- Grid panel -->
  <rect x="252" y="14" width="134" height="238" rx="8" fill="#FFFFFF" stroke="#DCE2EA"/>
  <rect x="252" y="14" width="134" height="30" rx="8" fill="#003B71"/>
  <rect x="252" y="34" width="134" height="10" fill="#003B71"/>
  <text x="264" y="34" font-family="Open Sans, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1,284 PARCELS</text>

  <!-- Filter chips -->
  <g font-family="Open Sans, Arial, sans-serif" font-size="7.5" font-weight="700">
    <rect x="262" y="54" width="54" height="14" rx="7" fill="#E5F2FC"/><text x="270" y="64" fill="#0072CE">Affordable</text>
    <rect x="320" y="54" width="58" height="14" rx="7" fill="#F5F5F5"/><text x="327" y="64" fill="#666666">Conservation</text>
  </g>

  <!-- Grid header -->
  <rect x="262" y="78" width="116" height="14" fill="#F5F7FA"/>
  <g font-family="Open Sans, Arial, sans-serif" font-size="7" font-weight="700" fill="#003B71">
    <text x="266" y="88">APN</text><text x="312" y="88">TYPE</text><text x="352" y="88">STATUS</text>
  </g>
  <!-- Grid rows -->
  <g font-family="Open Sans, Arial, sans-serif" font-size="7" fill="#404040">
    <rect x="262" y="94" width="116" height="16" fill="#D6EAFC"/>
    <text x="266" y="105">032-291-02</text><rect x="312" y="98" width="8" height="8" rx="2" fill="#0072CE"/><text x="324" y="105">AFF</text><text x="352" y="105">Active</text>
    <text x="266" y="123">028-164-11</text><rect x="312" y="116" width="8" height="8" rx="2" fill="#4A6118"/><text x="324" y="123">CON</text><text x="352" y="123">Active</text>
    <rect x="262" y="130" width="116" height="16" fill="#FAFBFC"/>
    <text x="266" y="141">122-071-04</text><rect x="312" y="134" width="8" height="8" rx="2" fill="#0072CE"/><text x="324" y="141">AFF</text><text x="352" y="141">Active</text>
    <text x="266" y="159">093-230-08</text><rect x="312" y="152" width="8" height="8" rx="2" fill="#E87722"/><text x="324" y="159">COV</text><text x="352" y="159">Expired</text>
    <rect x="262" y="166" width="116" height="16" fill="#FAFBFC"/>
    <text x="266" y="177">018-342-15</text><rect x="312" y="170" width="8" height="8" rx="2" fill="#4A6118"/><text x="324" y="177">CON</text><text x="352" y="177">Active</text>
    <text x="266" y="195">032-150-21</text><rect x="312" y="188" width="8" height="8" rx="2" fill="#0072CE"/><text x="324" y="195">AFF</text><text x="352" y="195">Active</text>
  </g>
  <g stroke="#DCE2EA">
    <line x1="262" y1="110" x2="378" y2="110"/><line x1="262" y1="128" x2="378" y2="128"/><line x1="262" y1="146" x2="378" y2="146"/>
    <line x1="262" y1="164" x2="378" y2="164"/><line x1="262" y1="182" x2="378" y2="182"/><line x1="262" y1="200" x2="378" y2="200"/>
  </g>

  <!-- Export button -->
  <rect x="262" y="218" width="116" height="20" rx="4" fill="#0072CE"/>
  <text x="320" y="232" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">EXPORT CSV</text>
</svg>
