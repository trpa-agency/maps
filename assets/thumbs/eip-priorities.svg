<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 266" width="400" height="266" role="img"
     aria-label="EIP funding priorities: a ranked list of projects with score bars, a funding cut line, and weight sliders">
  <!-- Background -->
  <rect width="400" height="266" fill="#EEF1F5"/>

  <!-- Ranked list card -->
  <rect x="14" y="14" width="240" height="238" rx="8" fill="#FFFFFF" stroke="#DCE2EA"/>
  <rect x="14" y="14" width="240" height="26" rx="8" fill="#0B1F41"/>
  <rect x="14" y="30" width="240" height="10" fill="#0B1F41"/>
  <text x="26" y="32" font-family="Lexend Deca, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">RANKED LIST</text>
  <text x="200" y="32" font-family="Lexend Deca, Arial, sans-serif" font-size="9" font-weight="700" fill="#6EBE44">$50M</text>

