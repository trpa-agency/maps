    <rect x="278" y="82" width="96" height="5" rx="3" fill="#E1E5EC"/><rect x="278" y="82" width="48" height="5" rx="3" fill="#007DC3"/><circle cx="326" cy="84.5" r="6" fill="#FFFFFF" stroke="#007DC3" stroke-width="2.5"/>
    <rect x="278" y="112" width="96" height="5" rx="3" fill="#E1E5EC"/><rect x="278" y="112" width="88" height="5" rx="3" fill="#007DC3"/><circle cx="366" cy="114.5" r="6" fill="#FFFFFF" stroke="#007DC3" stroke-width="2.5"/>
    <rect x="278" y="142" width="96" height="5" rx="3" fill="#E1E5EC"/><rect x="278" y="142" width="30" height="5" rx="3" fill="#007DC3"/><circle cx="308" cy="144.5" r="6" fill="#FFFFFF" stroke="#007DC3" stroke-width="2.5"/>
    <rect x="278" y="172" width="96" height="5" rx="3" fill="#E1E5EC"/><rect x="278" y="172" width="60" height="5" rx="3" fill="#007DC3"/><circle cx="338" cy="174.5" r="6" fill="#FFFFFF" stroke="#007DC3" stroke-width="2.5"/>
  </g>
  <g fill="#B9C3D1">
    <rect x="278" y="42" width="56" height="4" rx="2"/><rect x="278" y="72" width="44" height="4" rx="2"/><rect x="278" y="102" width="62" height="4" rx="2"/>
    <rect x="278" y="132" width="40" height="4" rx="2"/><rect x="278" y="162" width="52" height="4" rx="2"/>
  </g>
  <!-- focus area dots -->
  <g>
    <circle cx="284" cy="206" r="5" fill="#007DC3"/><circle cx="300" cy="206" r="5" fill="#6EBE44"/><circle cx="316" cy="206" r="5" fill="#F16022"/><circle cx="332" cy="206" r="5" fill="#0B1F41"/>
