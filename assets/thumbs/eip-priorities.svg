    <rect x="150" y="51" width="92" height="9" rx="4" fill="#E8F5E0"/><rect x="150" y="51" width="90" height="9" rx="4" fill="#6EBE44"/>
    <text x="26" y="84">2</text><circle cx="42" cy="80" r="4" fill="#F16022"/><rect x="52" y="76" width="70" height="7" rx="2" fill="#B9C3D1"/>
    <rect x="150" y="75" width="92" height="9" rx="4" fill="#E8F5E0"/><rect x="150" y="75" width="82" height="9" rx="4" fill="#6EBE44"/>
    <text x="26" y="108">3</text><circle cx="42" cy="104" r="4" fill="#6EBE44"/><rect x="52" y="100" width="94" height="7" rx="2" fill="#B9C3D1"/>
    <rect x="150" y="99" width="92" height="9" rx="4" fill="#E8F5E0"/><rect x="150" y="99" width="76" height="9" rx="4" fill="#6EBE44"/>
    <text x="26" y="132">4</text><circle cx="42" cy="128" r="4" fill="#007DC3"/><rect x="52" y="124" width="62" height="7" rx="2" fill="#B9C3D1"/>
    <rect x="150" y="123" width="92" height="9" rx="4" fill="#E8F5E0"/><rect x="150" y="123" width="70" height="9" rx="4" fill="#6EBE44"/>
