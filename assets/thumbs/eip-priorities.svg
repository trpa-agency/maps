  <!-- cut line -->
  <line x1="22" y1="146" x2="246" y2="146" stroke="#F16022" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="160" y="158" font-family="Lexend Deca, Arial, sans-serif" font-size="8" font-weight="700" fill="#F16022">ENVELOPE CUT LINE</text>
  <g font-family="Lexend Deca, Arial, sans-serif" font-size="9" font-weight="700" fill="#8A93A3">
    <text x="26" y="178">5</text><circle cx="42" cy="174" r="4" fill="#0B1F41" fill-opacity="0.45"/><rect x="52" y="170" width="80" height="7" rx="2" fill="#DCE2EA"/>
    <rect x="150" y="169" width="92" height="9" rx="4" fill="#EEF1F5"/><rect x="150" y="169" width="60" height="9" rx="4" fill="#C9CFD8"/>
    <text x="26" y="202">6</text><circle cx="42" cy="198" r="4" fill="#F16022" fill-opacity="0.45"/><rect x="52" y="194" width="72" height="7" rx="2" fill="#DCE2EA"/>
    <rect x="150" y="193" width="92" height="9" rx="4" fill="#EEF1F5"/><rect x="150" y="193" width="52" height="9" rx="4" fill="#C9CFD8"/>
    <text x="26" y="226">7</text><circle cx="42" cy="222" r="4" fill="#007DC3" fill-opacity="0.45"/><rect x="52" y="218" width="90" height="7" rx="2" fill="#DCE2EA"/>
    <rect x="150" y="217" width="92" height="9" rx="4" fill="#EEF1F5"/><rect x="150" y="217" width="44" height="9" rx="4" fill="#C9CFD8"/>
